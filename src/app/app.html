<main>
  @if(isOver) {
    <img class="moscow-img" alt="Butzer in Moscow" src="shaverma_moscow.jpg"/>
  } @else {
    <div>
      @if (!isRelaxVisible()) {
        <div class="relax-button-container">
          <button (click)="showRelax()" class="relax-button">отдохнуть</button>
        </div>
      }
      @if(isRelaxVisible()) {
        <app-relax></app-relax>
      } @else {
        <app-progress-bar></app-progress-bar>
      }
    </div>
  }
</main>
